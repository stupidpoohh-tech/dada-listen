<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>듣기 연습실 · dada-listening</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link rel="preconnect" href="https://unpkg.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" />
<style>
:root {
  --accent: #2f54eb;
  --accent-600: #1f3fd0;
  --accent-700: #1733ad;
  --accent-tint: #eef2ff;
  --accent-tint-2: #e0e7ff;

  --ink: #14161d;
  --ink-2: #4a4f5c;
  --ink-3: #868b98;
  --ink-4: #aeb3bf;

  --bg: #ffffff;
  --bg-soft: #f7f8fa;
  --bg-soft-2: #f1f2f6;
  --line: #e8e9ef;
  --line-2: #eff0f4;

  --ok: #18a957;
  --warn: #e0982a;

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --shadow-sm: 0 1px 2px rgba(20, 22, 29, 0.05);
  --shadow: 0 4px 18px rgba(20, 22, 29, 0.07);
  --shadow-lg: 0 18px 50px rgba(20, 22, 29, 0.16);

  --sans: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg-soft);
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
.btn, .nav-item, .topbar h1, .brand .name, .seg button, .tool, .tag-chip,
.list-head .h, .mode-pill, .side-section, .card-sub .pill { white-space: nowrap; }
::selection { background: var(--accent-tint-2); }

/* ---------- App shell ---------- */
.app { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; }
.sidebar {
  background: var(--bg);
  border-right: 1px solid var(--line);
  padding: 20px 14px;
  display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
.brand .mark {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
}
.brand .name { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.brand .sub { font-size: 11px; color: var(--ink-3); margin-top: 1px; }

.side-section { font-size: 11px; font-weight: 600; color: var(--ink-3); text-transform: none;
  letter-spacing: 0.02em; padding: 14px 10px 6px; display: flex; align-items: center; justify-content: space-between; }
.side-section .add { color: var(--ink-3); width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent;
  display: grid; place-items: center; font-size: 16px; }
.side-section .add:hover { background: var(--bg-soft-2); color: var(--accent); }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-sm);
  font-size: 13.5px; color: var(--ink-2); font-weight: 500;
  border: none; background: transparent; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg-soft); }
.nav-item.active { background: var(--accent-tint); color: var(--accent-700); font-weight: 600; }
.nav-item .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; background: var(--ink-4); }
.nav-item.active .dot { box-shadow: 0 0 0 2px var(--accent-tint-2); }
.nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--ink-4); font-weight: 500; }
.nav-item .row-edit { margin-left: auto; opacity: 0; color: var(--ink-3); }
.nav-item:hover .row-edit { opacity: 1; }

.tagrow { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px 8px; }
.tag-chip {
  font-size: 12px; padding: 4px 9px; border-radius: 999px;
  background: var(--bg-soft-2); color: var(--ink-2); border: 1px solid transparent;
}
.tag-chip:hover { background: var(--accent-tint); color: var(--accent-700); }
.tag-chip.active { background: var(--accent); color: #fff; }

.sidebar-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line-2); }

/* ---------- Main ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: rgba(255,255,255,0.86); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 14px 30px; display: flex; align-items: center; gap: 16px;
}
.topbar h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.topbar .crumb { color: var(--ink-3); font-size: 13px; }
.topbar .spacer { flex: 1; }

.content { padding: 26px 30px 80px; max-width: 920px; width: 100%; margin: 0 auto; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  box-shadow: var(--shadow-sm); transition: all .12s ease;
}
.btn:hover { border-color: var(--ink-4); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-600); border-color: var(--accent-600); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--bg-soft-2); }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: #c8392b; }
.btn.danger:hover { background: #fdecea; border-color: #f3c6c0; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.icon-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--bg); display: grid; place-items: center; color: var(--ink-2); box-shadow: var(--shadow-sm); }
.icon-btn:hover { border-color: var(--ink-4); color: var(--ink); }

.mode-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px;
  font-size: 12px; font-weight: 600; }
.mode-pill.admin { background: var(--accent-tint); color: var(--accent-700); }
.mode-pill.view { background: #eafaf0; color: #137a3f; }

/* ---------- Item card ---------- */
.card {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm); margin-bottom: 14px; overflow: hidden;
  transition: box-shadow .15s ease, border-color .15s ease;
}
.card.open { box-shadow: var(--shadow); border-color: var(--line); }
.card-head { display: flex; align-items: center; gap: 16px; padding: 16px 18px; }
.play-btn {
  width: 50px; height: 50px; flex: none; border-radius: 50%; border: none;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(47,84,235,0.32); transition: transform .12s ease, background .12s;
}
.play-btn:hover { transform: scale(1.05); background: var(--accent-600); }
.play-btn:active { transform: scale(0.97); }
.card-meta { min-width: 0; flex: 1; }
.card-title { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-sub { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--ink-3); }
.card-sub .pill { background: var(--bg-soft-2); padding: 2px 8px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.card-sub .tg { color: var(--accent); white-space: nowrap; }
.card-sub > span { white-space: nowrap; }
.chev { color: var(--ink-4); transition: transform .2s ease; }
.card.open .chev { transform: rotate(180deg); }

.card-body { border-top: 1px solid var(--line-2); }

/* ---------- Player controls ---------- */
.player { padding: 16px 18px; background: var(--bg-soft); border-bottom: 1px solid var(--line-2); }
.scrub { display: flex; align-items: center; gap: 12px; }
.time { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; min-width: 42px; }
.track { position: relative; flex: 1; height: 6px; border-radius: 999px; background: var(--bg-soft-2); cursor: pointer; }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--accent); }
.track .ab { position: absolute; top: 0; bottom: 0; background: rgba(47,84,235,0.16); }
.track .marker { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--accent-700); }
.track .knob { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff;
  border: 2px solid var(--accent); transform: translate(-50%,-50%); box-shadow: var(--shadow-sm); }

.player-tools { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--bg-soft-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: none; background: transparent; padding: 5px 11px; border-radius: 7px; font-size: 12.5px;
  font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--bg); color: var(--accent-700); box-shadow: var(--shadow-sm); }
.tool { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--bg); font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.tool:hover { border-color: var(--ink-4); }
.tool.on { background: var(--accent-tint); border-color: var(--accent-tint-2); color: var(--accent-700); }
.tool .ab-state { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--ink-3); }

/* ---------- Passage ---------- */
.passage-wrap { padding: 8px 22px 24px; }
.passage-bar { display: flex; align-items: center; gap: 10px; padding: 12px 0 14px; }
.passage-bar .label { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.passage {
  font-family: var(--serif); font-size: 20px; line-height: 1.95; color: var(--ink);
  letter-spacing: -0.003em; max-width: 64ch;
}
.passage.collapsed { max-height: 0; overflow: hidden; opacity: 0; }
.w { border-radius: 4px; padding: 0 1px; cursor: pointer; transition: background .1s; }
.w:hover { background: var(--accent-tint); }
.w.noted { border-bottom: 2px solid var(--accent); }
.blank {
  display: inline-block; min-width: 4.5ch; text-align: center;
  border-bottom: 2px solid var(--accent); color: transparent; position: relative;
  cursor: pointer; margin: 0 1px; font-family: var(--sans); font-weight: 600;
}
.blank::after { content: attr(data-len); color: var(--ink-4); font-size: 13px; font-family: var(--sans);
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); }
.blank.revealed { color: var(--accent-700); border-bottom-color: var(--accent-700); font-family: var(--serif); }
.blank.revealed::after { content: ''; }

.empty {
  text-align: center; padding: 70px 20px; color: var(--ink-3);
}
.empty .big { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-tint); color: var(--accent);
  display: grid; place-items: center; margin: 0 auto 16px; }
.empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 17px; }
.empty p { margin: 0 0 18px; font-size: 13.5px; }

/* ---------- Word popover ---------- */
.popover {
  position: fixed; z-index: 60; background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-lg); width: 280px; padding: 14px; font-family: var(--sans);
}
.popover .head { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
.popover .pron { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
.popover textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-family: inherit; font-size: 13px; resize: vertical; min-height: 56px; color: var(--ink); }
.popover textarea:focus { outline: none; border-color: var(--accent); }
.popover .row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.popover a.dict { font-size: 12.5px; color: var(--accent); text-decoration: none; font-weight: 600; }

/* ---------- Modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(20,22,29,0.42); z-index: 80; display: grid; place-items: center; padding: 24px; }
.modal { background: var(--bg); border-radius: var(--r-xl); box-shadow: var(--shadow-lg); width: 640px; max-width: 100%;
  max-height: 90vh; overflow-y: auto; }
.modal-head { display: flex; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--bg); z-index: 2; }
.modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; }
.modal-body { padding: 22px 24px; }
.modal-foot { padding: 16px 24px; border-top: 1px solid var(--line-2); display: flex; gap: 10px; justify-content: flex-end;
  position: sticky; bottom: 0; background: var(--bg); }

.field { margin-bottom: 18px; }
.field > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; }
.field .hint { font-size: 11.5px; color: var(--ink-3); font-weight: 400; }
.input, textarea.input, select.input {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--sans);
  font-size: 14px; color: var(--ink); background: var(--bg);
}
textarea.input { resize: vertical; line-height: 1.6; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }

.dropzone {
  border: 1.5px dashed var(--line); border-radius: var(--r); padding: 26px; text-align: center; color: var(--ink-3);
  background: var(--bg-soft); transition: all .15s;
}
.dropzone.drag { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-700); }
.dropzone .ic { width: 42px; height: 42px; margin: 0 auto 10px; border-radius: 12px; background: var(--bg); display: grid; place-items: center; color: var(--accent); box-shadow: var(--shadow-sm); }

.progress { height: 8px; border-radius: 999px; background: var(--bg-soft-2); overflow: hidden; margin-top: 12px; }
.progress .bar { height: 100%; background: var(--accent); transition: width .2s; }

.chips-input { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.chips-input input { border: none; outline: none; font-family: inherit; font-size: 13.5px; flex: 1; min-width: 80px; padding: 4px; }
.mini-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--accent-tint); color: var(--accent-700);
  border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 600; }
.mini-chip button { border: none; background: transparent; color: var(--accent); cursor: pointer; padding: 0; line-height: 1; }

/* gap editor */
.gap-editor { font-family: var(--serif); font-size: 17px; line-height: 1.9; border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px; background: var(--bg-soft); max-height: 240px; overflow-y: auto; }
.gap-editor .gw { cursor: pointer; border-radius: 4px; padding: 0 1px; }
.gap-editor .gw.on { background: var(--accent); color: #fff; }
.gap-editor .gw:not(.on):hover { background: var(--accent-tint); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
  padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 100; box-shadow: var(--shadow-lg);
  animation: toastin .2s ease; }
@keyframes toastin { from { opacity: 0; transform: translate(-50%, 8px); } }

.list-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.list-head .h { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.list-head .c { font-size: 13px; color: var(--ink-3); }

/* lock screen */
.lock { min-height: 100vh; display: grid; place-items: center; background: var(--bg-soft); }
.lock .box { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-xl); box-shadow: var(--shadow);
  width: 360px; padding: 30px; text-align: center; }
.lock .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 16px; }

/* hamburger + drawer-close are desktop-hidden by default */
.menu-btn { display: none; }
.drawer-close { display: none; margin-left: auto; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }

  /* sidebar becomes a slide-in drawer */
  .sidebar {
    position: fixed; top: 0; left: 0; z-index: 90;
    height: 100dvh; width: 286px; max-width: 86vw;
    transform: translateX(-102%); transition: transform .26s cubic-bezier(.4,0,.2,1);
    box-shadow: var(--shadow-lg);
    padding-top: max(20px, env(safe-area-inset-top));
  }
  .sidebar.open { transform: none; }
  .nav-backdrop { position: fixed; inset: 0; z-index: 85; background: rgba(20,22,29,0.46);
    backdrop-filter: blur(2px); animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .menu-btn { display: grid; flex: none; }
  .drawer-close { display: grid; }

  /* larger nav tap targets */
  .nav-item { padding: 11px 12px; font-size: 14.5px; }
  .tag-chip { padding: 7px 12px; font-size: 13px; }
  .side-section { padding: 16px 10px 6px; }

  /* topbar: icons only for actions, sticky safe-area */
  .topbar { padding: 10px 14px; gap: 8px; padding-top: max(10px, env(safe-area-inset-top)); }
  .topbar h1 { font-size: 17px; overflow: hidden; text-overflow: ellipsis; }
  .topbar .crumb { display: none; }
  .topbar .btn .lbl { display: none; }
  .topbar .btn.sm { padding: 9px; }
  .topbar .btn.primary.sm { background: var(--accent); }
  .topbar .mode-pill.view { display: none; }

  .content { padding: 18px 14px calc(80px + env(safe-area-inset-bottom)); }
  .list-head { margin-bottom: 14px; }
  .list-head .h { font-size: 19px; }

  /* cards */
  .card-head { gap: 13px; padding: 14px; }
  .play-btn { width: 52px; height: 52px; }
  .card-title { font-size: 15.5px; white-space: normal; }
  .card-sub { flex-wrap: wrap; row-gap: 4px; }

  /* player controls: bigger touch targets, no horizontal overflow */
  .player { padding: 14px; }
  .player-tools { gap: 7px; }
  .seg button { padding: 8px 12px; font-size: 13px; }
  .tool { padding: 9px 12px; font-size: 13px; }
  .track { height: 8px; }
  .track .knob { width: 18px; height: 18px; }

  /* passage: comfortable reading + tappable words/blanks */
  .passage-wrap { padding: 6px 14px 22px; }
  .passage { font-size: 19px; line-height: 2.05; }
  .passage .w { padding: 2px 2px; }
  .blank { min-width: 5ch; padding: 2px 0; }

  /* word popover as a centered card */
  .popover { width: min(300px, calc(100vw - 28px)); padding: 16px; }
  .popover textarea { min-height: 64px; font-size: 14px; }

  /* modal fills the screen comfortably */
  .overlay { padding: 0; place-items: stretch; }
  .modal { width: 100%; max-width: 100%; max-height: 100dvh; border-radius: 0; }
  .modal-body { padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .modal-head { padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
  .modal-foot { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .modal-body > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
}

</style>
</head>
<body>
<div id="root">
  <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;background:#f6f7f9;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
      <div style="width:46px;height:46px;border-radius:13px;background:#2f54eb;display:grid;place-items:center;box-shadow:0 6px 20px rgba(47,84,235,.28);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M3 12h2M8 7v10M12 4v16M16 8v8M21 12h-1"/></svg>
      </div>
      <div style="font:600 14px/1 system-ui,'Pretendard Variable',sans-serif;color:#8a909c;letter-spacing:.01em;">듣기 연습실 여는 중…</div>
      <div style="width:120px;height:3px;border-radius:2px;background:#e6e8ec;overflow:hidden;">
        <div style="width:40%;height:100%;border-radius:2px;background:#2f54eb;animation:bootbar 1.1s ease-in-out infinite;"></div>
      </div>
    </div>
  </div>
</div>
<style>@keyframes bootbar{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}</style>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script>
/* store.js — Firebase-backed persistence (Firestore ONLY — no Storage).
 *  - Firestore doc `app/state` holds { folders, items } (text + metadata only).
 *  - Audio/video bytes live in Firestore too: collection `media`, one meta doc
 *    per file with a `parts` subcollection of base64 chunks (<1MB each).
 *    This avoids Firebase Storage entirely (no billing / Blaze plan needed).
 *  - Auth (email/password) gates the single admin; students read with no login.
 * The whole app talks only to window.LDB, so the backend stays isolated. */
(function () {
  const db = firebase.firestore();
  const auth = firebase.auth();
  // 로컬 캐시(IndexedDB): 재방문 시 네트워크를 기다리지 않고 즉시 표시 + 오프라인 동작.
  try { db.enablePersistence({ synchronizeTabs: true }).catch(function () {}); } catch (e) {}
  const STATE_DOC = db.collection('app').doc('state');
  const MEDIA = db.collection('media');

  // Firestore doc max is ~1 MiB. base64 inflates bytes ~1.37x, so keep each
  // chunk well under the limit. 700 KB of base64 ≈ 512 KB of raw audio.
  const CHUNK = 700 * 1024;
  const safeId = (p) => (p || '').replace(/[\/.#$\[\]]/g, '_');

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => { const s = String(r.result); res(s.slice(s.indexOf(',') + 1)); };
      r.onerror = () => rej(r.error || new Error('read-failed'));
      r.readAsDataURL(blob);
    });
  }
  function base64ToBlob(b64, mime) {
    const bin = atob(b64);
    const len = bin.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: mime || 'application/octet-stream' });
  }

  async function loadState() {
    try {
      const snap = await STATE_DOC.get();
      if (snap.exists) {
        const d = snap.data();
        return { folders: d.folders || [], items: d.items || [] };
      }
    } catch (e) { console.error('[LDB] loadState', e); }
    return { folders: [], items: [] };
  }

  // Firestore throws on ANY `undefined` value and rejects the WHOLE write — a
  // single stray undefined field (e.g. an item missing folderId) silently kills
  // a save. Deep-clean the payload so edits can never be torpedoed by one field.
  function clean(v) {
    if (Array.isArray(v)) return v.map(clean);
    if (v && typeof v === 'object') {
      const o = {};
      for (const k in v) { if (v[k] !== undefined) o[k] = clean(v[k]); }
      return o;
    }
    return v;
  }

  async function saveState(s) {
    await STATE_DOC.set({
      folders: clean(s.folders || []),
      items: clean(s.items || []),
      updatedAt: Date.now(),
    });
  }

  // 단일 구독으로 첫 로드 + 실시간 갱신을 모두 처리(중복 읽기 제거). 캐시가 있으면
  // 첫 콜백이 즉시 캐시 데이터로 발생하고, 이어 서버 데이터로 갱신됩니다.
  function subscribe(cb) {
    return STATE_DOC.onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : {};
      cb({ folders: d.folders || [], items: d.items || [] });
    }, (e) => { console.error('[LDB] subscribe', e); cb({ folders: [], items: [] }); });
  }

  // ---- Media (Firestore-chunked) ----
  // path = 'audio/<id>.<ext>'. Stored as media/<safeId> + parts/<i>. Returns path.
  async function putBlob(path, blob, onProgress) {
    const id = safeId(path);
    const EXT_MIME = { mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac', weba: 'audio/webm', wma: 'audio/x-ms-wma', mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm', mkv: 'video/x-matroska', '3gp': 'video/3gpp' };
    const ext = (path.match(/\.([a-z0-9]+)$/i) || ['', ''])[1].toLowerCase();
    const mime = blob.type || EXT_MIME[ext] || 'application/octet-stream';
    onProgress && onProgress(0.02);
    const b64 = await blobToBase64(blob);
    const total = Math.max(1, Math.ceil(b64.length / CHUNK));
    const docRef = MEDIA.doc(id);
    // Write chunks first, then the meta doc (so a half-written file is never
    // considered complete). Chunks are written in small batches.
    for (let i = 0; i < total; i++) {
      const part = b64.slice(i * CHUNK, (i + 1) * CHUNK);
      await docRef.collection('parts').doc(String(i)).set({ d: part });
      onProgress && onProgress(0.05 + 0.9 * ((i + 1) / total));
    }
    await docRef.set({ mime, chunks: total, size: blob.size || 0, ext: (path.match(/\.[^.]+$/) || [''])[0], createdAt: Date.now() });
    onProgress && onProgress(1);
    return path;
  }

  // Reassemble chunks into a Blob and return an object URL.
  async function getBlobURL(path) {
    if (!path) return null;
    if (/^https?:/.test(path) || /^blob:/.test(path)) return path; // legacy / external
    try {
      const docRef = MEDIA.doc(safeId(path));
      const meta = await docRef.get();
      if (!meta.exists) { console.warn('[LDB] media missing', path); return null; }
      const { mime, chunks } = meta.data();
      const gets = [];
      for (let i = 0; i < chunks; i++) gets.push(docRef.collection('parts').doc(String(i)).get());
      const snaps = await Promise.all(gets);
      let b64 = '';
      for (const s of snaps) b64 += (s.exists ? s.data().d : '');
      return URL.createObjectURL(base64ToBlob(b64, mime));
    } catch (e) { console.error('[LDB] getBlobURL', e); return null; }
  }

  async function delBlob(path) {
    if (!path || /^https?:/.test(path)) return;
    try {
      const docRef = MEDIA.doc(safeId(path));
      const meta = await docRef.get();
      if (meta.exists) {
        const { chunks } = meta.data();
        const dels = [];
        for (let i = 0; i < (chunks || 0); i++) dels.push(docRef.collection('parts').doc(String(i)).delete());
        await Promise.all(dels);
        await docRef.delete();
      }
    } catch (e) { /* already gone */ }
  }

  const uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  // ---- Auth ----
  try { auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch (e) {}
  function onAuth(cb) { return auth.onAuthStateChanged(cb); }
  function signIn(email, pw) { return auth.signInWithEmailAndPassword(email, pw); }
  function signOut() { return auth.signOut(); }
  function resetPassword(email) { return auth.sendPasswordResetEmail(email); }

  window.LDB = {
    loadState, saveState, subscribe,
    putBlob, getBlobURL, delBlob, uid,
    onAuth, signIn, signOut, resetPassword,
    get user() { return auth.currentUser; },
  };
})();

</script>

<script>
/* gapfill.js — deterministic tokenizer + key-word gap selection.
 * Strategy: blank "content-rich" words — longer, lower-frequency,
 * skipping stopwords, numbers, and very short words — while never
 * blanking two adjacent words, so the passage stays readable. */
(function () {
  const STOP = new Set(('a an the and or but if then else of to in on at by for with as is are was were be been being ' +
    'this that these those it its he she they them his her their you your i we our us me my do does did done have has had ' +
    'will would can could shall should may might must not no nor so than too very just from into over under out up down ' +
    'about after before again more most some such only own same also each few other which who whom whose what when where ' +
    'why how all any both because while during between through against above below off here there now once').split(/\s+/));

  // common-ish words we still don't want to blank even if long-ish
  const COMMON = new Set(('people because before through always around different something important another however ' +
    'someone everyone without between sometimes together').split(/\s+/));

  function tokenize(text) {
    // Split into word / non-word runs, preserving everything.
    const tokens = [];
    const re = /([A-Za-z]+(?:['’-][A-Za-z]+)*)|([^A-Za-z]+)/g;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m[1]) tokens.push({ t: 'w', s: m[1] });
      else tokens.push({ t: 'x', s: m[2] });
    }
    return tokens;
  }

  function scoreWord(w) {
    const lw = w.toLowerCase();
    if (lw.length < 5) return -1;
    if (STOP.has(lw)) return -1;
    if (COMMON.has(lw)) return 0.5;
    let s = lw.length;                       // longer = more "worth" testing
    if (/(tion|ment|ness|ity|ous|ive|ize|ise|ical|ance|ence)$/.test(lw)) s += 3; // morphologically rich
    if (lw.length >= 8) s += 2;
    return s;
  }

  /* Returns an array of token indices (into tokenize output) to blank. */
  function generateGaps(text, ratio) {
    ratio = ratio == null ? 0.18 : ratio;
    const tokens = tokenize(text);
    const cands = [];
    tokens.forEach((tk, i) => {
      if (tk.t !== 'w') return;
      const sc = scoreWord(tk.s);
      if (sc > 0) cands.push({ i, sc });
    });
    const wordCount = tokens.filter((t) => t.t === 'w').length;
    const target = Math.max(1, Math.round(wordCount * ratio));
    cands.sort((a, b) => b.sc - a.sc || a.i - b.i);

    const chosen = new Set();
    const tokenIndexSorted = tokens.map((t, i) => i);
    // helper: is a word-token adjacent (ignoring non-word tokens) already chosen?
    function neighborChosen(idx) {
      // previous word token
      for (let j = idx - 1; j >= 0; j--) {
        if (tokens[j].t === 'w') return chosen.has(j);
      }
      return false;
    }
    function nextNeighborChosen(idx) {
      for (let j = idx + 1; j < tokens.length; j++) {
        if (tokens[j].t === 'w') return chosen.has(j);
      }
      return false;
    }
    for (const c of cands) {
      if (chosen.size >= target) break;
      if (neighborChosen(c.i) || nextNeighborChosen(c.i)) continue;
      chosen.add(c.i);
    }
    return Array.from(chosen).sort((a, b) => a - b);
  }

  window.GAPFILL = { tokenize, generateGaps };
})();

</script>

<script>
/* extract.js — prepare an uploaded media file for storage.
 * NOTE: no audio extraction. Audio files and video files are both stored
 * as-is; the player plays AUDIO ONLY (video frame is never shown). This is
 * the most robust path across browsers (esp. iOS Safari), which cannot
 * reliably extract audio in-browser.
 * onProgress(0..1, label) is optional. */
(function () {
  // Map file extensions → MIME types. Browsers sometimes hand us a File with an
  // empty `type` (common on Windows for .mp3/.m4a, and for some drag-drops), so
  // we must NOT trust file.type alone — otherwise an MP3 gets misclassified as a
  // "video", stored with no MIME, and then refuses to play back.
  const EXT_MIME = {
    mp3: 'audio/mpeg', m4a: 'audio/mp4', aac: 'audio/aac', wav: 'audio/wav',
    ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac',
    weba: 'audio/webm', wma: 'audio/x-ms-wma',
    mp4: 'video/mp4', m4v: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm',
    mkv: 'video/x-matroska', avi: 'video/x-msvideo', '3gp': 'video/3gpp', ogv: 'video/ogg',
  };
  const AUDIO_EXTS = new Set(['mp3', 'm4a', 'aac', 'wav', 'ogg', 'oga', 'opus', 'flac', 'weba', 'wma']);
  const extOf = (name) => { const m = (name || '').toLowerCase().match(/\.([a-z0-9]+)$/); return m ? m[1] : ''; };

  function getMediaDuration(blob, tag) {
    return new Promise((res) => {
      const el = document.createElement(tag);
      let url = null, settled = false;
      const done = (v) => { if (settled) return; settled = true; try { if (url) URL.revokeObjectURL(url); } catch (e) {} res(isFinite(v) && v > 0 ? v : 0); };
      el.preload = 'metadata';
      el.muted = true;
      el.onloadedmetadata = () => {
        // Chrome reports Infinity for MP3s lacking a duration header; seeking to
        // the end forces it to compute the real duration.
        if (el.duration === Infinity || isNaN(el.duration)) {
          el.ontimeupdate = () => { el.ontimeupdate = null; const d = el.duration; el.currentTime = 0; done(d); };
          try { el.currentTime = 1e101; } catch (e) { done(0); }
        } else {
          done(el.duration);
        }
      };
      el.onerror = () => done(0);
      setTimeout(() => done(el.duration), 5000); // safety net so we never hang
      try { url = URL.createObjectURL(blob); el.src = url; } catch (e) { done(0); }
    });
  }

  async function extractAudio(file, onProgress) {
    onProgress && onProgress(0.35, '파일 확인 중…');
    const ext = extOf(file.name);
    // Trust file.type if present, otherwise infer from the extension.
    const mime = file.type || EXT_MIME[ext] || '';
    const isAudio = mime ? mime.startsWith('audio/') : AUDIO_EXTS.has(ext);
    // Re-stamp the blob with a correct MIME when the browser gave us none, so
    // it stores and plays back reliably.
    let blob = file;
    if (!file.type && mime) { try { blob = file.slice(0, file.size, mime); } catch (e) {} }
    // Read duration from the matching element; video files report duration too.
    const durationSec = await getMediaDuration(blob, isAudio ? 'audio' : 'video');
    onProgress && onProgress(1, isAudio ? '음성 준비 완료' : '영상 준비 완료 — 오디오만 재생됩니다');
    return { blob, durationSec, kind: isAudio ? 'audio' : 'original' };
  }

  window.AUDIO = { extractAudio };
})();

</script>

<script type="text/babel">
/* player.jsx — ItemCard: collapsible card with audio player + passage.
 * Audio (play/pause/seek/speed/A-B loop) lives here; passage renders in
 * full or gap-fill mode with click-to-reveal blanks and word memos. */
const { useState, useEffect, useRef, useCallback } = React;

function WordPopover({ pop, onClose, onSave, readOnly }) {
  const [val, setVal] = useState(pop.note || '');
  useEffect(() => { setVal(pop.note || ''); }, [pop.word]);
  const ref = useRef(null);
  useEffect(() => {
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, []);
  const left = Math.min(pop.x, window.innerWidth - 296);
  const top = Math.min(pop.y + 10, window.innerHeight - 220);
  const dict = 'https://en.dict.naver.com/#/search?query=' + encodeURIComponent(pop.word);
  if (readOnly) {
    return (
      <div className="popover" ref={ref} style={{ left, top }}>
        <div className="head">{pop.word}</div>
        {pop.note
          ? <div style={{ fontSize: 13.5, color: 'var(--ink)', margin: '4px 0 12px', lineHeight: 1.55 }}>{pop.note}</div>
          : <div className="pron">아직 메모가 없어요. 사전에서 뜻을 확인해 보세요.</div>}
        <div className="row">
          <a className="dict" href={dict} target="_blank" rel="noreferrer">네이버 사전에서 보기 ↗</a>
          <div style={{ flex: 1 }} />
          <button className="btn ghost sm" onClick={onClose}>닫기</button>
        </div>
      </div>
    );
  }
  return (
    <div className="popover" ref={ref} style={{ left, top }}>
      <div className="head">{pop.word}</div>
      <div className="pron">단어 뜻을 메모하거나 사전에서 확인하세요</div>
      <textarea value={val} placeholder="뜻 / 메모 입력…" onChange={(e) => setVal(e.target.value)} autoFocus />
      <div className="row">
        <a className="dict" href={dict} target="_blank" rel="noreferrer">네이버 사전에서 보기 ↗</a>
        <div style={{ flex: 1 }} />
        <button className="btn primary sm" onClick={() => { onSave(pop.word, val.trim()); onClose(); }}>저장</button>
      </div>
    </div>
  );
}

function Passage({ item, version, notes, onWordClick }) {
  const tokens = GAPFILL.tokenize(item.passage);
  const gapSet = new Set(item.gapIndices || []);
  const [revealed, setRevealed] = useState(() => new Set());
  useEffect(() => { setRevealed(new Set()); }, [version, item.id]);

  return (
    <div className="passage">
      {tokens.map((tk, i) => {
        if (tk.t !== 'w') return <span key={i}>{tk.s}</span>;
        const lw = tk.s.toLowerCase();
        if (version === 'gap' && gapSet.has(i)) {
          const rv = revealed.has(i);
          return (
            <span key={i} className={'blank' + (rv ? ' revealed' : '')} data-len={'·'.repeat(Math.min(tk.s.length, 9))}
              onClick={() => setRevealed((s) => { const n = new Set(s); n.has(i) ? n.delete(i) : n.add(i); return n; })}>
              {rv ? tk.s : '\u00A0'.repeat(Math.max(4, tk.s.length))}
            </span>
          );
        }
        const noted = notes[lw];
        return (
          <span key={i} className={'w' + (noted ? ' noted' : '')}
            onClick={(e) => onWordClick(tk.s, lw, e.clientX, e.clientY)}>{tk.s}</span>
        );
      })}
    </div>
  );
}

function ItemCard({ item, folder, isAdmin, onEdit, onDelete, onUpdateNote, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  const [url, setUrl] = useState(null);
  const [playing, setPlaying] = useState(false);
  const [cur, setCur] = useState(0);
  const [dur, setDur] = useState(item.durationSec || 0);
  const [rate, setRate] = useState(1);
  const [version, setVersion] = useState('gap');
  const [showPassage, setShowPassage] = useState(true);
  const [abA, setAbA] = useState(null);
  const [abB, setAbB] = useState(null);
  const [loop, setLoop] = useState(false);
  const [pop, setPop] = useState(null);
  const [menu, setMenu] = useState(false);
  const audioRef = useRef(null);

  // resolve blob url lazily once opened/played
  const ensureUrl = useCallback(async () => {
    if (url) return url;
    const u = await LDB.getBlobURL(item.audioBlobId);
    setUrl(u);
    return u;
  }, [url, item.audioBlobId]);

  useEffect(() => {
    const onPlay = (e) => { if (e.detail !== audioRef.current && audioRef.current) audioRef.current.pause(); };
    window.addEventListener('lab-play', onPlay);
    return () => window.removeEventListener('lab-play', onPlay);
  }, []);

  useEffect(() => { if (audioRef.current) audioRef.current.playbackRate = rate; }, [rate, url]);

  const togglePlay = async () => {
    setOpen(true);
    await ensureUrl();
    const a = audioRef.current;
    if (!a) return;
    if (a.paused) {
      window.dispatchEvent(new CustomEvent('lab-play', { detail: a }));
      a.play();
    } else a.pause();
  };

  const onTime = () => {
    const a = audioRef.current; if (!a) return;
    setCur(a.currentTime);
    if (loop && abA != null && abB != null && a.currentTime >= abB) {
      a.currentTime = abA;
    }
  };

  const seekTo = (clientX, el) => {
    const a = audioRef.current; if (!a || !dur) return;
    const r = el.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    a.currentTime = p * dur;
    setCur(a.currentTime);
  };

  const notes = item.notes || {};
  const rates = [
    { v: 1, label: '보통' },
    { v: 0.8, label: '느리게' },
    { v: 0.6, label: '아주 느리게' },
  ];
  const fcolor = folder ? folder.color : 'var(--ink-4)';

  return (
    <div className={'card' + (open ? ' open' : '')}>
      <div className="card-head">
        <button className="play-btn" onClick={togglePlay} aria-label="재생">
          {playing ? <Ic.pause s={22} /> : <Ic.play s={22} />}
        </button>
        <div className="card-meta" onClick={() => setOpen((o) => !o)} style={{ cursor: 'pointer' }}>
          <div className="card-title">{item.title}</div>
          <div className="card-sub">
            {folder && <span className="pill" style={{ color: fcolor }}>{folder.name}</span>}
            <span>{fmt(dur)}</span>
            {(item.tags || []).slice(0, 3).map((t) => <span key={t} className="tg">#{t}</span>)}
          </div>
        </div>
        {isAdmin && (
          <div style={{ position: 'relative' }}>
            <button className="icon-btn" onClick={() => setMenu((m) => !m)} aria-label="메뉴"><Ic.more /></button>
            {menu && (
              <div style={{ position: 'absolute', right: 0, top: 40, background: '#fff', border: '1px solid var(--line)', borderRadius: 10, boxShadow: 'var(--shadow-lg)', padding: 6, zIndex: 30, width: 130 }}>
                <button className="btn ghost sm" style={{ width: '100%', justifyContent: 'flex-start' }} onClick={() => { setMenu(false); onEdit(item); }}><Ic.edit /> 편집</button>
                <button className="btn ghost sm danger" style={{ width: '100%', justifyContent: 'flex-start' }} onClick={() => { setMenu(false); onDelete(item); }}><Ic.trash /> 삭제</button>
              </div>
            )}
          </div>
        )}
        <button className="icon-btn" style={{ border: 'none', boxShadow: 'none', background: 'transparent' }} onClick={() => setOpen((o) => !o)} aria-label="펼치기">
          <span className="chev"><Ic.chev /></span>
        </button>
      </div>

      {open && (
        <div className="card-body">
          <div className="player">
            <video ref={audioRef} playsInline preload="metadata"
              style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }}
              onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)}
              onLoadedMetadata={(e) => { if (isFinite(e.target.duration)) setDur(e.target.duration); e.target.playbackRate = rate; }}
              onTimeUpdate={onTime} onEnded={() => setPlaying(false)} src={url || undefined} />
            <div className="scrub">
              <span className="time">{fmt(cur)}</span>
              <div className="track" onClick={(e) => seekTo(e.clientX, e.currentTarget)}
                onMouseDown={(e) => {
                  const el = e.currentTarget; const mv = (ev) => seekTo(ev.clientX, el);
                  const up = () => { document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
                  document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
                }}>
                {abA != null && abB != null && dur > 0 && (
                  <div className="ab" style={{ left: (abA / dur) * 100 + '%', width: ((abB - abA) / dur) * 100 + '%' }} />
                )}
                <div className="fill" style={{ width: (dur ? (cur / dur) * 100 : 0) + '%' }} />
                {abA != null && dur > 0 && <div className="marker" style={{ left: (abA / dur) * 100 + '%' }} />}
                {abB != null && dur > 0 && <div className="marker" style={{ left: (abB / dur) * 100 + '%' }} />}
                <div className="knob" style={{ left: (dur ? (cur / dur) * 100 : 0) + '%' }} />
              </div>
              <span className="time" style={{ textAlign: 'right' }}>{fmt(dur)}</span>
            </div>

            <div className="player-tools">
              <div className="seg seg-rate">
                {rates.map((r) => (
                  <button key={r.v} className={rate === r.v ? 'on' : ''} onClick={() => setRate(r.v)}>{r.label}</button>
                ))}
              </div>

              <button className={'tool' + (abA != null ? ' on' : '')} onClick={() => setAbA(audioRef.current ? audioRef.current.currentTime : 0)}>
                A {abA != null && <span className="ab-state">{fmt(abA)}</span>}
              </button>
              <button className={'tool' + (abB != null ? ' on' : '')} onClick={() => { const t = audioRef.current ? audioRef.current.currentTime : 0; if (abA == null || t > abA) setAbB(t); }}>
                B {abB != null && <span className="ab-state">{fmt(abB)}</span>}
              </button>
              <button className={'tool' + (loop ? ' on' : '')} disabled={abA == null || abB == null} onClick={() => setLoop((l) => !l)}>
                <Ic.reset s={15} /> 구간반복
              </button>
              {(abA != null || abB != null) && (
                <button className="btn ghost sm" onClick={() => { setAbA(null); setAbB(null); setLoop(false); }}>초기화</button>
              )}
            </div>
          </div>

          <div className="passage-wrap">
            <div className="passage-bar">
              <div className="seg">
                <button className={version === 'gap' ? 'on' : ''} onClick={() => setVersion('gap')}>갭필</button>
                <button className={version === 'full' ? 'on' : ''} onClick={() => setVersion('full')}>풀 버전</button>
              </div>
              {version === 'gap' && <span className="label">빈칸을 눌러 정답 확인</span>}
              <div style={{ flex: 1 }} />
              <button className="btn ghost sm" onClick={() => setShowPassage((s) => !s)}>{showPassage ? '지문 접기' : '지문 펼치기'}</button>
            </div>
            {showPassage && (
              <Passage item={item} version={version} notes={notes}
                onWordClick={(word, lw, x, y) => setPop({ word, lw, x, y, note: notes[lw] || '' })} />
            )}
          </div>
        </div>
      )}

      {pop && (
        <WordPopover pop={pop} readOnly={!isAdmin} onClose={() => setPop(null)}
          onSave={(word, note) => onUpdateNote(item.id, word.toLowerCase(), note)} />
      )}
    </div>
  );
}

Object.assign(window, { ItemCard, Passage, WordPopover });

</script>

<!-- app/admin.jsx -->
<script type="text/babel">
/* admin.jsx — UploadModal (add/edit item) + FolderModal. Admin-only UI. */
const { useState, useEffect, useRef } = React;

function GapEditor({ passage, gapSet, onToggle }) {
  const tokens = GAPFILL.tokenize(passage);
  return (
    <div className="gap-editor">
      {tokens.map((tk, i) => {
        if (tk.t !== 'w') return <span key={i}>{tk.s}</span>;
        const on = gapSet.has(i);
        return <span key={i} className={'gw' + (on ? ' on' : '')} onClick={() => onToggle(i)}>{tk.s}</span>;
      })}
    </div>
  );
}

function UploadModal({ item, folders, onSave, onClose, toast }) {
  const editing = !!item;
  const [title, setTitle] = useState(item ? item.title : '');
  const [folderId, setFolderId] = useState(item ? item.folderId : (folders[0] ? folders[0].id : ''));
  const [tags, setTags] = useState(item ? [...(item.tags || [])] : []);
  const [tagInput, setTagInput] = useState('');
  const [passage, setPassage] = useState(item ? item.passage : '');
  const [gapSet, setGapSet] = useState(() => new Set(item ? (item.gapIndices || []) : []));
  const [drag, setDrag] = useState(false);
  const [proc, setProc] = useState(false);
  const [prog, setProg] = useState(0);
  const [progLabel, setProgLabel] = useState('');
  const [newBlob, setNewBlob] = useState(null);
  const [newExt, setNewExt] = useState('');
  const [previewIsVideo, setPreviewIsVideo] = useState(false);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [durationSec, setDurationSec] = useState(item ? (item.durationSec || 0) : 0);
  const [fileName, setFileName] = useState(item ? '기존 음원' : '');
  const fileRef = useRef(null);

  useEffect(() => {
    if (editing && item.audioBlobId) LDB.getBlobURL(item.audioBlobId).then(setPreviewUrl);
  }, []);

  const handleFile = async (file) => {
    if (!file) return;
    setProc(true); setProg(0.02); setProgLabel('파일 읽는 중…'); setFileName(file.name);
    try {
      const res = await AUDIO.extractAudio(file, (p, label) => { setProg(p); if (label) setProgLabel(label); });
      setNewBlob(res.blob);
      setNewExt((file.name.match(/\.[^.]+$/) || [''])[0]);
      setDurationSec(res.durationSec || 0);
      if (previewUrl && previewUrl.startsWith('blob:')) URL.revokeObjectURL(previewUrl);
      setPreviewUrl(URL.createObjectURL(res.blob));
      setPreviewIsVideo(res.kind === 'original');
      if (!title) setTitle(file.name.replace(/\.[^.]+$/, ''));
      const isVid = res.kind === 'original';
      setProgLabel(isVid ? '영상 준비 완료 — 오디오만 재생됩니다' : '음성 준비 완료');
      toast(isVid ? '영상을 불러왔어요 (오디오만 재생됩니다)' : '음성을 불러왔어요');
    } catch (e) {
      console.error(e);
      toast('처리 실패: ' + (e.message || '알 수 없는 오류'));
      setProgLabel('실패했어요. 다른 파일을 시도해 보세요.');
    } finally { setProc(false); }
  };

  const autoGap = () => {
    if (!passage.trim()) { toast('먼저 지문을 입력하세요'); return; }
    setGapSet(new Set(GAPFILL.generateGaps(passage, 0.18)));
  };
  const toggleGap = (i) => setGapSet((s) => { const n = new Set(s); n.has(i) ? n.delete(i) : n.add(i); return n; });
  const addTag = (raw) => {
    const t = raw.trim().replace(/^#/, '');
    if (t && !tags.includes(t)) setTags([...tags, t]);
    setTagInput('');
  };

  const canSave = title.trim() && passage.trim() && (editing ? item.audioBlobId || newBlob : newBlob);

  const save = async () => {
    let audioBlobId = editing ? item.audioBlobId : null;
    if (newBlob) {
      const path = 'audio/' + LDB.uid('a_') + (newExt || '');
      setProc(true); setProg(0); setProgLabel('클라우드에 업로드 중…');
      try {
        await LDB.putBlob(path, newBlob, (p) => setProg(p));
      } catch (e) {
        console.error('[upload]', e);
        const code = e && (e.code || e.message) ? (' (' + (e.code || e.message) + ')') : '';
        toast('업로드 실패' + code + ' — 잠시 후 다시 시도하세요');
        setProc(false); setProgLabel(''); return;
      }
      const old = editing ? item.audioBlobId : null;
      audioBlobId = path;
      if (old) LDB.delBlob(old);
      setProc(false);
    }
    const next = {
      id: editing ? item.id : LDB.uid('i_'),
      title: title.trim(), folderId, tags, passage: passage.trim(),
      gapIndices: Array.from(gapSet).sort((a, b) => a - b),
      audioBlobId, durationSec,
      notes: editing ? (item.notes || {}) : {},
      createdAt: editing ? item.createdAt : Date.now(),
    };
    onSave(next);
  };

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target.classList.contains('overlay')) onClose(); }}>
      <div className="modal">
        <div className="modal-head">
          <h2>{editing ? '음성 편집' : '새 음성 추가'}</h2>
          <div style={{ flex: 1 }} />
          <button className="icon-btn" onClick={onClose}><Ic.x /></button>
        </div>
        <div className="modal-body">
          {!editing || newBlob || previewUrl ? null : null}
          <div className="field">
            <label>영상 또는 음성 파일 <span className="hint">· 영상도 올릴 수 있어요 (오디오만 재생됩니다)</span></label>
            <div className={'dropzone' + (drag ? ' drag' : '')}
              onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={(e) => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
              onClick={() => fileRef.current && fileRef.current.click()}>
              <div className="ic"><Ic.film /></div>
              <div style={{ fontWeight: 600, color: 'var(--ink)' }}>{fileName || '파일을 끌어다 놓거나 클릭'}</div>
              <div style={{ fontSize: 12, marginTop: 4 }}>mp4 · mov · mp3 · m4a · wav</div>
              <input ref={fileRef} type="file" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.opus,.flac,.wma,.mp4,.m4v,.mov,.webm,.mkv,.3gp" style={{ display: 'none' }}
                onChange={(e) => handleFile(e.target.files[0])} />
            </div>
            {proc && <div className="progress"><div className="bar" style={{ width: (prog * 100) + '%' }} /></div>}
            {progLabel && <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 8 }}>{progLabel}</div>}
            {previewUrl && !proc && (
              previewIsVideo
                ? <video controls playsInline src={previewUrl} style={{ width: '100%', marginTop: 12, maxHeight: 200, borderRadius: 10, background: '#000' }} />
                : <audio controls src={previewUrl} style={{ width: '100%', marginTop: 12, height: 38 }} />
            )}
          </div>

          <div className="field">
            <label>제목</label>
            <input className="input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="예: 2024 수능특강 Unit 5 - Climate" />
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
            <div className="field">
              <label>폴더</label>
              <select className="input" value={folderId} onChange={(e) => setFolderId(e.target.value)}>
                <option value="">폴더 없음</option>
                {folders.map((f) => <option key={f.id} value={f.id}>{f.name}</option>)}
              </select>
            </div>
            <div className="field">
              <label>태그 <span className="hint">· Enter로 추가</span></label>
              <div className="chips-input">
                {tags.map((t) => <span key={t} className="mini-chip">#{t}<button onClick={() => setTags(tags.filter((x) => x !== t))}>×</button></span>)}
                <input value={tagInput} onChange={(e) => setTagInput(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addTag(tagInput); } if (e.key === 'Backspace' && !tagInput && tags.length) setTags(tags.slice(0, -1)); }}
                  placeholder={tags.length ? '' : '환경, 고난도…'} />
              </div>
            </div>
          </div>

          <div className="field">
            <label>지문 (영어) <span className="hint">· 들리는 영어 스크립트를 붙여넣으세요</span></label>
            <textarea className="input" rows={5} value={passage} onChange={(e) => setPassage(e.target.value)}
              placeholder="Paste the English transcript here…" />
          </div>

          <div className="field">
            <label style={{ display: 'flex', alignItems: 'center' }}>
              갭필 미리보기 <span className="hint">· 단어를 클릭해 빈칸을 켜고 끌 수 있어요</span>
              <span style={{ flex: 1 }} />
              <button className="btn sm" onClick={autoGap} type="button"><Ic.wave s={15} /> 핵심 단어 자동 선정</button>
            </label>
            {passage.trim()
              ? <GapEditor passage={passage} gapSet={gapSet} onToggle={toggleGap} />
              : <div className="gap-editor" style={{ color: 'var(--ink-3)' }}>지문을 입력하면 빈칸을 만들 수 있어요.</div>}
            {gapSet.size > 0 && <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 6 }}>빈칸 {gapSet.size}개</div>}
          </div>
        </div>
        <div className="modal-foot">
          {proc && <span style={{ fontSize: 12.5, color: 'var(--ink-3)', marginRight: 'auto' }}>{prog > 0 ? `업로드 중 ${Math.round(prog * 100)}%` : (progLabel || '준비 중…')}</span>}
          <button className="btn ghost" onClick={onClose} disabled={proc}>취소</button>
          <button className="btn primary" disabled={!canSave || proc} onClick={save}><Ic.check /> {proc ? (prog > 0 ? `업로드 중 ${Math.round(prog * 100)}%` : '업로드 중…') : (editing ? '저장' : '추가하기')}</button>
        </div>
      </div>
    </div>
  );
}

function FolderModal({ folder, onSave, onClose, onDelete }) {
  const [name, setName] = useState(folder ? folder.name : '');
  const [color, setColor] = useState(folder ? folder.color : FOLDER_COLORS[0]);
  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target.classList.contains('overlay')) onClose(); }}>
      <div className="modal" style={{ width: 420 }}>
        <div className="modal-head"><h2>{folder ? '폴더 편집' : '새 폴더'}</h2><div style={{ flex: 1 }} /><button className="icon-btn" onClick={onClose}><Ic.x /></button></div>
        <div className="modal-body">
          <div className="field">
            <label>폴더 이름</label>
            <input className="input" autoFocus value={name} onChange={(e) => setName(e.target.value)} placeholder="예: 수능특강, 모의고사…" onKeyDown={(e) => { if (e.key === 'Enter' && name.trim()) onSave({ name: name.trim(), color }); }} />
          </div>
          <div className="field">
            <label>색상</label>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              {FOLDER_COLORS.map((c) => (
                <button key={c} onClick={() => setColor(c)} style={{ width: 30, height: 30, borderRadius: 9, background: c, border: color === c ? '2px solid var(--ink)' : '2px solid transparent', cursor: 'pointer', outline: color === c ? '2px solid #fff' : 'none', outlineOffset: -4 }} />
              ))}
            </div>
          </div>
        </div>
        <div className="modal-foot">
          {folder && <button className="btn ghost danger" style={{ marginRight: 'auto' }} onClick={() => onDelete(folder)}><Ic.trash /> 삭제</button>}
          <button className="btn ghost" onClick={onClose}>취소</button>
          <button className="btn primary" disabled={!name.trim()} onClick={() => onSave({ name: name.trim(), color })}>저장</button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { UploadModal, FolderModal, GapEditor });

</script>

<!-- app/app.jsx -->
<script type="text/babel">
/* app.jsx — App shell: sidebar, list, routing (admin ⇄ student view),
 * Firebase auth gate, and Firestore-backed state. */
const { useState, useEffect, useRef } = React;

function App() {
  const [loaded, setLoaded] = useState(false);
  const [authReady, setAuthReady] = useState(false);
  const [user, setUser] = useState(null);
  const [state, setState] = useState({ folders: [], items: [] });
  const [mode, setMode] = useState(location.hash.startsWith('#/admin') ? 'admin' : 'view');
  const [sel, setSel] = useState('all');
  const [selTag, setSelTag] = useState(null);
  const [upload, setUpload] = useState(null);
  const [folderModal, setFolderModal] = useState(null);
  const [navOpen, setNavOpen] = useState(false);
  const [toastMsg, setToastMsg] = useState('');
  const [openId] = useState(null);
  const toastT = useRef(null);
  const toast = (m) => { setToastMsg(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToastMsg(''), 2400); };

  useEffect(() => {
    const onHash = () => setMode(location.hash.startsWith('#/admin') ? 'admin' : 'view');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  useEffect(() => LDB.onAuth((u) => { setUser(u); setAuthReady(true); }), []);

  // Keep a live ref to the newest state so saves never write a stale snapshot
  // captured when a modal was opened (the Firestore subscription updates state
  // in the background, which would otherwise clobber an in-progress edit).
  const stateRef = useRef(state);
  stateRef.current = state;

  useEffect(() => {
    const unsub = LDB.subscribe((s) => { setState(s); setLoaded(true); });
    return () => unsub && unsub();
  }, []);

  const persist = (s) => {
    setState(s);
    stateRef.current = s;
    return LDB.saveState(s).catch((e) => {
      console.error('[save]', e);
      const why = e && e.code === 'permission-denied'
        ? '권한 없음 — 다시 로그인해 주세요'
        : (e && (e.code || e.message)) || '알 수 없는 오류';
      toast('저장 실패: ' + why);
      throw e;
    });
  };

  const folderOf = (id) => state.folders.find((f) => f.id === id);
  const allTags = Array.from(new Set(state.items.flatMap((i) => i.tags || []))).sort();
  let items = state.items.slice().sort((a, b) => b.createdAt - a.createdAt);
  if (sel !== 'all') items = items.filter((i) => i.folderId === sel);
  if (selTag) items = items.filter((i) => (i.tags || []).includes(selTag));

  const saveItem = (it) => {
    const cur = stateRef.current;
    const exists = cur.items.some((x) => x.id === it.id);
    const next = exists ? cur.items.map((x) => (x.id === it.id ? it : x)) : [...cur.items, it];
    persist({ ...cur, items: next })
      .then(() => { setUpload(null); toast(exists ? '저장했어요' : '음성을 추가했어요'); })
      .catch(() => {}); // error toast already shown by persist; keep modal open so work isn't lost
  };
  const deleteItem = async (it) => {
    if (!confirm('이 음성을 삭제할까요?')) return;
    const cur = stateRef.current;
    persist({ ...cur, items: cur.items.filter((x) => x.id !== it.id) });
    if (it.audioBlobId) LDB.delBlob(it.audioBlobId);
    toast('삭제했어요');
  };
  const updateNote = (itemId, lw, note) => {
    const cur = stateRef.current;
    const next = cur.items.map((it) => {
      if (it.id !== itemId) return it;
      const notes = { ...(it.notes || {}) };
      if (note) notes[lw] = note; else delete notes[lw];
      return { ...it, notes };
    });
    persist({ ...cur, items: next });
  };
  const saveFolder = (data) => {
    const cur = stateRef.current;
    if (folderModal.id) persist({ ...cur, folders: cur.folders.map((f) => (f.id === folderModal.id ? { ...f, ...data } : f)) });
    else persist({ ...cur, folders: [...cur.folders, { id: LDB.uid('f_'), ...data }] });
    setFolderModal(null);
  };
  const deleteFolder = (f) => {
    const cur = stateRef.current;
    const inside = cur.items.filter((i) => i.folderId === f.id);
    if (!confirm(inside.length ? `폴더 안의 음성 ${inside.length}개도 함께 삭제됩니다. 계속할까요?` : '폴더를 삭제할까요?')) return;
    inside.forEach((i) => i.audioBlobId && LDB.delBlob(i.audioBlobId));
    persist({ folders: cur.folders.filter((x) => x.id !== f.id), items: cur.items.filter((i) => i.folderId !== f.id) });
    if (sel === f.id) setSel('all');
    setFolderModal(null);
  };
  const copyShare = () => {
    const url = location.origin + location.pathname + '#/view';
    navigator.clipboard.writeText(url).then(() => toast('학생용 보기 링크를 복사했어요')).catch(() => toast(url));
  };

  if (!authReady || !loaded) return <div className="lock"><div style={{ color: 'var(--ink-3)' }}>불러오는 중…</div></div>;

  if (mode === 'admin' && !user) {
    return <Login onView={() => { location.hash = '#/view'; }} toast={toast} />;
  }

  const isAdmin = mode === 'admin' && !!user;
  const curFolder = sel === 'all' ? null : folderOf(sel);
  const heading = sel === 'all' ? '전체 음성' : (curFolder ? curFolder.name : '');

  return (
    <div className={'app' + (navOpen ? ' nav-open' : '')}>
      {navOpen && <div className="nav-backdrop" onClick={() => setNavOpen(false)} />}
      <aside className={'sidebar' + (navOpen ? ' open' : '')}>
        <div className="brand">
          <div className="mark"><Ic.wave s={18} /></div>
          <div>
            <div className="name">듣기 연습실</div>
            <div className="sub">Listening Lab</div>
          </div>
          <button className="drawer-close icon-btn" onClick={() => setNavOpen(false)} aria-label="닫기"><Ic.x /></button>
        </div>

        <button className={'nav-item' + (sel === 'all' && !selTag ? ' active' : '')} onClick={() => { setSel('all'); setSelTag(null); setNavOpen(false); }}>
          <Ic.layers /> 전체 음성 <span className="count">{state.items.length}</span>
        </button>

        <div className="side-section">폴더{isAdmin && <button className="add" onClick={() => setFolderModal({})}><Ic.plus s={16} /></button>}</div>
        {state.folders.map((f) => (
          <button key={f.id} className={'nav-item' + (sel === f.id ? ' active' : '')} onClick={() => { setSel(f.id); setSelTag(null); setNavOpen(false); }}>
            <span className="dot" style={{ background: f.color }} />
            {f.name}
            {isAdmin && <span className="row-edit" onClick={(e) => { e.stopPropagation(); setFolderModal(f); }}><Ic.edit s={14} /></span>}
            <span className="count">{state.items.filter((i) => i.folderId === f.id).length}</span>
          </button>
        ))}
        {state.folders.length === 0 && isAdmin && (
          <button className="nav-item" style={{ color: 'var(--accent)' }} onClick={() => setFolderModal({})}><Ic.plus s={16} /> 첫 폴더 만들기</button>
        )}

        {allTags.length > 0 && <>
          <div className="side-section">태그</div>
          <div className="tagrow">
            {allTags.map((t) => (
              <button key={t} className={'tag-chip' + (selTag === t ? ' active' : '')} onClick={() => { setSelTag(selTag === t ? null : t); setNavOpen(false); }}>#{t}</button>
            ))}
          </div>
        </>}

        <div className="sidebar-foot">
          {isAdmin
            ? <div style={{ fontSize: 11.5, color: 'var(--ink-3)', padding: '4px 8px', lineHeight: 1.5 }}>
                <span className="mode-pill admin"><Ic.lock s={13} /> 관리자</span>
                <div style={{ marginTop: 8, wordBreak: 'break-all' }}>{user.email}</div>
                <button className="btn ghost sm" style={{ marginTop: 8, paddingLeft: 8 }} onClick={() => LDB.signOut()}>로그아웃</button>
              </div>
            : <div style={{ fontSize: 11.5, color: 'var(--ink-3)', padding: '4px 8px', lineHeight: 1.5 }}>
                <span className="mode-pill view"><Ic.eye s={13} /> 보기 전용</span>
                <div style={{ marginTop: 8 }}>학생용 화면입니다</div>
              </div>}
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <button className="menu-btn icon-btn" onClick={() => setNavOpen(true)} aria-label="메뉴"><Ic.menu /></button>
          <h1>{heading}</h1>
          {selTag && <span className="crumb">#{selTag}</span>}
          <div className="spacer" />
          {isAdmin ? <>
            <button className="btn ghost sm" onClick={() => { location.hash = '#/view'; }}><Ic.eye /> <span className="lbl">학생 보기</span></button>
            <button className="btn sm" onClick={copyShare}><Ic.link /> <span className="lbl">공유 링크</span></button>
            <button className="btn primary sm" onClick={() => setUpload({ item: null })}><Ic.upload s={16} /> <span className="lbl">새 음성</span></button>
          </> : <>
            <span className="mode-pill view"><Ic.eye s={13} /> 보기 전용</span>
            <button className="btn ghost sm" onClick={() => { location.hash = '#/admin'; }}><Ic.lock s={15} /> <span className="lbl">관리자</span></button>
          </>}
        </div>

        <div className="content">
          {items.length === 0 ? (
            <div className="empty">
              <div className="big"><Ic.wave s={26} /></div>
              <h3>{state.items.length === 0 ? '아직 음성이 없어요' : '여기에는 음성이 없어요'}</h3>
              <p>{isAdmin ? '영상이나 음성을 올려 첫 듣기 자료를 만들어 보세요.' : '곧 자료가 추가될 예정이에요.'}</p>
              {isAdmin && <button className="btn primary" onClick={() => setUpload({ item: null })}><Ic.upload /> 새 음성 추가</button>}
            </div>
          ) : (
            <div>
              <div className="list-head"><span className="h">{heading}</span><span className="c">{items.length}개</span></div>
              {items.map((it) => (
                <ItemCard key={it.id} item={it} folder={folderOf(it.folderId)} isAdmin={isAdmin}
                  defaultOpen={openId === it.id}
                  onEdit={(i) => setUpload({ item: i })}
                  onDelete={deleteItem}
                  onUpdateNote={updateNote} />
              ))}
            </div>
          )}
        </div>
      </main>

      {upload && <UploadModal item={upload.item} folders={state.folders} onSave={saveItem} onClose={() => setUpload(null)} toast={toast} />}
      {folderModal && <FolderModal folder={folderModal.id ? folderModal : null} onSave={saveFolder} onClose={() => setFolderModal(null)} onDelete={deleteFolder} />}
      {toastMsg && <div className="toast">{toastMsg}</div>}
    </div>
  );
}

const AUTH_ERR = {
  'auth/invalid-email': '이메일 형식이 올바르지 않아요',
  'auth/user-not-found': '등록되지 않은 계정이에요',
  'auth/wrong-password': '비밀번호가 일치하지 않아요',
  'auth/invalid-credential': '이메일 또는 비밀번호가 올바르지 않아요',
  'auth/missing-password': '비밀번호를 입력하세요',
  'auth/too-many-requests': '시도가 너무 많아요. 잠시 후 다시 시도하세요',
  'auth/network-request-failed': '네트워크 오류예요. 연결을 확인하세요',
};

function Login({ onView, toast }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const submit = async () => {
    if (!email || !pw) { setErr('이메일과 비밀번호를 입력하세요'); return; }
    setBusy(true); setErr('');
    try { await LDB.signIn(email.trim(), pw); }
    catch (e) { setErr(AUTH_ERR[e.code] || '로그인에 실패했어요'); }
    finally { setBusy(false); }
  };
  const reset = async () => {
    if (!email) { setErr('재설정 메일을 받을 이메일을 먼저 입력하세요'); return; }
    try { await LDB.resetPassword(email.trim()); toast('비밀번호 재설정 메일을 보냈어요'); }
    catch (e) { setErr(AUTH_ERR[e.code] || '메일 전송에 실패했어요'); }
  };
  return (
    <div className="lock">
      <div className="box">
        <div className="mark"><Ic.lock /></div>
        <h2 style={{ margin: '0 0 6px', fontSize: 18 }}>관리자 로그인</h2>
        <p style={{ color: 'var(--ink-3)', fontSize: 13, margin: '0 0 18px' }}>듣기 자료를 관리하려면 로그인하세요.</p>
        <input className="input" type="email" placeholder="이메일" value={email} autoFocus autoComplete="username"
          style={{ marginBottom: 10 }} onChange={(e) => { setEmail(e.target.value); setErr(''); }}
          onKeyDown={(e) => e.key === 'Enter' && submit()} />
        <input className="input" type="password" placeholder="비밀번호" value={pw} autoComplete="current-password"
          onChange={(e) => { setPw(e.target.value); setErr(''); }} onKeyDown={(e) => e.key === 'Enter' && submit()} />
        {err && <div style={{ color: '#c8392b', fontSize: 12.5, marginTop: 8, textAlign: 'left' }}>{err}</div>}
        <button className="btn primary" style={{ width: '100%', justifyContent: 'center', marginTop: 16 }} disabled={busy} onClick={submit}>{busy ? '확인 중…' : '로그인'}</button>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 12 }}>
          <button className="btn ghost sm" style={{ paddingLeft: 6 }} onClick={onView}><Ic.eye /> 학생 보기</button>
          <button className="btn ghost sm" style={{ color: 'var(--ink-3)', paddingRight: 6 }} onClick={reset}>비밀번호 재설정</button>
        </div>
        <div style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 14, lineHeight: 1.5 }}>로그인 상태는 이 브라우저에 자동으로 유지됩니다.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

  </g>

</template>
</body>
</html>
